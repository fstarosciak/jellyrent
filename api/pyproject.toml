[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jellyrent"
version = "0.1.0"
description = "Distributed DVD-style movie rental on top of Jellyfin nodes"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running central database (TEST_DATABASE_URL)",
]
addopts = "-ra --strict-markers"

# ----------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "PT", "RET"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "N818",   # domain exceptions read better without an Error suffix (NotFound, Forbidden)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

# ----------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
